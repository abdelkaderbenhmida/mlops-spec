global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: node_gcp
    static_configs:
      - targets:
          - '<gcp-cp-ip>:9100'
          - '<gcp-w1-ip>:9100'
          - '<gcp-w2-ip>:9100'

  - job_name: node_oci
    static_configs:
      - targets:
          - '<oci-training-ip>:9100'
          - '<oci-monitoring-ip>:9100'

  - job_name: churn_api
    metrics_path: /metrics
    static_configs:
      - targets:
          - '<gcp-lb-ip>:80'