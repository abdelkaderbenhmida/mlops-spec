---
# ML playbook: runs mlflow on mlflow_local and training on training_local.
- name: Bootstrap local servers
  hosts: mlflow_local, training_local
  become: true
  roles:
    - common
    - docker

- name: Deploy MLflow
  hosts: mlflow_local
  become: true
  roles:
    - mlflow

- name: Prepare training environment
  hosts: training_local
  become: true
  roles:
    - training