---
# Master playbook: runs all roles on all local hosts in correct order.
# Usage: ansible-playbook -i inventory/hosts.yml site.yml
- name: Bootstrap all hosts
  hosts: all
  become: true
  roles:
    - common
    - docker

- name: Configure Kubernetes cluster (local hosts only)
  hosts: k8s_local
  become: true
  roles:
    - kubernetes

- name: Deploy MLflow (local host only)
  hosts: mlflow_local
  become: true
  roles:
    - mlflow

- name: Deploy monitoring stack (local host only)
  hosts: monitoring_local
  become: true
  roles:
    - monitoring

- name: Prepare training environment (local host only)
  hosts: training_local
  become: true
  roles:
    - training