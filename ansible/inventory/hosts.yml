---
# ALL-LOCAL inventory — no cloud. Every host maps to 127.0.0.1 with a local
# connection; roles execute on the local machine. The old cloud inventory
# (GCP 35.0.0.x / OCI 129.0.0.x) was removed. Use `ansible-playbook
# --syntax-check` for validation only.
all:
  vars:
    ansible_connection: local
  children:
    gcp_k8s:
      hosts:
        gcp-k8s-cp:
          ansible_host: 127.0.0.1
        gcp-k8s-w1:
          ansible_host: 127.0.0.1
        gcp-k8s-w2:
          ansible_host: 127.0.0.1
    oci:
      hosts:
        oci-training:
          ansible_host: 127.0.0.1
        oci-monitoring:
          ansible_host: 127.0.0.1
