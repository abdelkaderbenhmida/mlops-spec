---
# ALL-LOCAL inventory — no cloud. Every logical host maps to 127.0.0.1 with a
# local connection; roles execute on the local machine. The old cloud
# inventory (GCP 35.0.0.x / OCI 129.0.0.x) was removed. Use
# `ansible-playbook --syntax-check` for validation only.
all:
  vars:
    ansible_connection: local
    ansible_ssh_port: 22
  children:
    k8s_local:
      hosts:
        k8s-cp:
          ansible_host: 127.0.0.1
        k8s-w1:
          ansible_host: 127.0.0.1
        k8s-w2:
          ansible_host: 127.0.0.1
    mlflow_local:
      hosts:
        mlflow-server:
          ansible_host: 127.0.0.1
    monitoring_local:
      hosts:
        monitoring-server:
          ansible_host: 127.0.0.1
    training_local:
      hosts:
        training-env:
          ansible_host: 127.0.0.1