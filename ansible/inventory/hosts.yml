---
# Static inventory — host inventory is normally generated from Terraform
# outputs via scripts/terraform_inventory.py (see README). Keep this file as
# a documented fallback so `ansible-playbook site.yml` runs out of the box.
all:
  children:
    gcp_k8s:
      hosts:
        gcp-k8s-cp:
          ansible_host: 35.0.0.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        gcp-k8s-w1:
          ansible_host: 35.0.0.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        gcp-k8s-w2:
          ansible_host: 35.0.0.12
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
    oci:
      hosts:
        oci-training:
          ansible_host: 129.0.0.10
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
        oci-monitoring:
          ansible_host: 129.0.0.11
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/id_rsa
