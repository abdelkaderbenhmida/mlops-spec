---
# Common role: base packages, timezone, UFW, node exporter.
# Runs on every host. Safe to re-run (idempotent).
- name: Set timezone to UTC
  timezone:
    name: UTC
  when: ansible_os_family == "Debian"

- name: apt update (cache_valid_time)
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  apt:
    name: "{{ common_packages }}"
    state: present

# --- node exporter -----------------------------------------------------
- name: Install node exporter
  unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: true
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    mode: "0755"

- name: Symlink node_exporter binary
  file:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link

- name: Create node_exporter user
  user:
    name: node_exporter
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install node_exporter systemd unit
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
  notify: restart node_exporter

- name: Enable and start node_exporter
  systemd:
    name: node_exporter
    enabled: true
    state: started
    daemon_reload: true

# --- UFW -----------------------------------------------------------------
- name: Install UFW
  apt:
    name: ufw
    state: present

- name: Configure UFW default policies
  community.general.ufw:
    default: "{{ item }}"
  loop:
    - deny
    - allow
  notify: enable ufw

- name: Allow UFW ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ ufw_allow_ports }}"
  notify: enable ufw

- name: Enable UFW
  community.general.ufw:
    state: enabled
