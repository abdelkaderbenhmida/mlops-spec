---
# Defaults for the common role.
common_packages:
  - git
  - curl
  - wget
  - unzip
  - ca-certificates
  - gnupg
  - software-properties-common

node_exporter_version: 1.7.0

# Host-level UFW allowance. ALL-LOCAL — no cloud firewall; UFW is the only
# policy layer. Ports serve the local stack (node exporter, MLflow, Prometheus,
# Grafana).
ufw_allow_ports:
  - "22"
  - "9100"
  - "5000"
  - "9090"
  - "3000"
