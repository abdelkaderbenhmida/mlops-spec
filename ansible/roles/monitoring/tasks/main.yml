---
# Monitoring role: run Prometheus + Grafana as Docker containers on oci-monitoring.
# Prometheus scrapes node exporters on all VMs and the churn API /metrics.
# Idempotent — safe to re-run.
- name: Create monitoring directories
  file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /opt/prometheus
    - /opt/prometheus/data
    - /opt/grafana
    - /opt/grafana/provisioning/datasources
    - /opt/grafana/provisioning/dashboards
    - /opt/grafana/dashboards

- name: Render Prometheus scrape config
  template:
    src: prometheus.yml.j2
    dest: /opt/prometheus/prometheus.yml
  notify: restart prometheus

- name: Render Grafana datasource provisioning file
  template:
    src: datasource.yml.j2
    dest: /opt/grafana/provisioning/datasources/datasource.yml
  notify: restart grafana

- name: Render Grafana dashboards provisioning file
  template:
    src: dashboards.yml.j2
    dest: /opt/grafana/provisioning/dashboards/dashboards.yml
  notify: restart grafana

- name: Copy custom ML API dashboard
  copy:
    src: "{{ item }}"
    dest: /opt/grafana/dashboards/
    mode: "0644"
  loop:
    - ml-api-dashboard.json
  notify: restart grafana

- name: Run Prometheus container
  docker_container:
    name: prometheus
    image: "prom/prometheus:v{{ prometheus_version }}"
    restart_policy: unless-stopped
    state: started
    ports:
      - "{{ prometheus_port }}:9090"
    volumes:
      - /opt/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /opt/prometheus/data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

- name: Run Grafana container
  docker_container:
    name: grafana
    image: "{{ grafana_image }}"
    restart_policy: unless-stopped
    state: started
    env:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_password }}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "{{ grafana_port }}:3000"
    volumes:
      - /opt/grafana/provisioning:/etc/grafana/provisioning:ro
      - /opt/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

- name: Wait for Prometheus to be reachable
  uri:
    url: "http://{{ ansible_host }}:{{ prometheus_port }}/-/healthy"
    status_code: 200
  register: prom_health
  retries: 30
  delay: 2
  until: prom_health.status == 200
